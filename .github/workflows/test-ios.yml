name: iOS unit tests

on:
  workflow_call:
    inputs:
      artifact-suffix:
        type: string
        required: false
        default: ''
      logger-comparison:
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
      - uses: actions/download-artifact@v7
        with:
          name: UnitTests-iOS-JsRuntimeHost-JavaScriptCore
          path: test-artifacts/UnitTests-iOS-JsRuntimeHost-JavaScriptCore
      - name: Boot iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: 'iPhone 17'
          os_version: '>=26.0'
          wait_for_boot: true
      - name: Ensure per-suite timeout tool
        run: command -v gtimeout || brew install coreutils
      - name: Install and run iOS JsRuntimeHost tests
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          LOGGER_COMPARISON: ${{ inputs.logger-comparison }}
        run: |
          set -euo pipefail
          expected_tests=
          case "$LOGGER_COMPARISON" in
            '') ;;
            full) expected_tests=30 ;;
            filtered)
              export SIMCTL_CHILD_GTEST_FILTER='-StandardStreamLogger.*'
              expected_tests=29
              ;;
            *) echo "::error::Invalid logger comparison mode"; exit 1 ;;
          esac
          mkdir -p test-results
          shopt -s nullglob
          artifacts=(test-artifacts/*)
          [[ ${#artifacts[@]} -eq 1 ]] || { echo "::error::Expected exactly one iOS artifact"; exit 1; }
          name=UnitTests-iOS-JsRuntimeHost-JavaScriptCore
          directory="test-artifacts/$name"
          application=com.jsruntimehost.unittests
          app=UnitTests.app
          test -f "$directory/app.tar.gz"
          tar -xzf "$directory/app.tar.gz" -C "$directory"
          test -d "$directory/$app"
          gtimeout 120s xcrun simctl install "$SIMULATOR" "$directory/$app"
          trap 'code=$?; gtimeout 120s xcrun simctl uninstall "$SIMULATOR" "$application" || code=1; exit "$code"' EXIT
          status=0
          gtimeout 20m xcrun simctl launch --console "$SIMULATOR" "$application" \
            > "test-results/$name.stdout.log" 2> "test-results/$name.stderr.log" || status=$?
          echo "Simulator launch exit status: $status"
          cat "test-results/$name.stdout.log"
          cat "test-results/$name.stderr.log" >&2
          test "$status" -eq 0
          tail -n 1 "test-results/$name.stderr.log" | tr -d '\r ' | grep -x 0
          if [[ -n "$expected_tests" ]]; then
            grep -Fq "[==========] Running $expected_tests tests" "test-results/$name.stdout.log" \
              || { echo "::error::Unexpected test count"; exit 1; }
            grep -Fq "[  PASSED  ] $expected_tests tests." "test-results/$name.stdout.log" \
              || { echo "::error::Missing passing test summary"; exit 1; }
            if [[ "$LOGGER_COMPARISON" == filtered ]]; then
              grep -Fq 'Note: Google Test filter = -StandardStreamLogger.*' "test-results/$name.stdout.log" \
                || { echo "::error::Missing stream-logger filter"; exit 1; }
              if grep -Fq '[ RUN      ] StandardStreamLogger.Lifecycle' "test-results/$name.stdout.log"; then
                echo "::error::The stream-logger test ran despite the filter"
                exit 1
              fi
            else
              grep -Fq '[ RUN      ] StandardStreamLogger.Lifecycle' "test-results/$name.stdout.log" \
                || { echo "::error::The stream-logger test did not run"; exit 1; }
            fi
          fi
      - name: Collect iOS failure diagnostics
        if: ${{ failure() && steps.simulator.outputs.udid != '' }}
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p test-results/diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            \( -name 'UnitTests*.ips' -o -name 'UnitTests*.crash' \) \
            -exec cp {} test-results/diagnostics/ \;
          gtimeout 120s xcrun simctl spawn "$SIMULATOR" log show --last 10m --style compact \
            --predicate 'process == "UnitTests" OR eventMessage CONTAINS "com.jsruntimehost.unittests"' \
            > test-results/diagnostics/simulator.log
      - name: Upload test results
        if: ${{ !cancelled() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: iOS-unit-test-results${{ inputs.artifact-suffix }}
          path: test-results
          if-no-files-found: error
