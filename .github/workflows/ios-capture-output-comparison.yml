name: iOS output capture comparison

on:
  push:
    branches:
      - ios-capture-output-comparison-616

jobs:
  build:
    uses: ./.github/workflows/build-ios.yml
    with:
      deployment-target: '26.0'
      xcode-version: '26.4'
      runs-on: macos-26

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trial: ['01', '02']
        mode: ['console', 'direct']
    uses: ./.github/workflows/test-ios.yml
    with:
      artifact-suffix: '-${{ matrix.trial }}-${{ matrix.mode }}'
      capture-comparison: ${{ matrix.mode }}
