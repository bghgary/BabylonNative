name: Build mobile unit-test artifacts
description: Build JsRuntimeHost's platform test projects and publish their artifacts.

inputs:
  platform:
    required: true
    description: Android or iOS
  js-engine:
    default: JavaScriptCore
    description: JavaScript engine used by this platform configuration
  deployment-target:
    default: '26.0'
    description: Minimum iOS simulator version

runs:
  using: composite
  steps:
    - name: Install Android unit-test toolchain
      if: inputs.platform == 'Android'
      shell: bash
      run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.30.3"
    - name: Build Android JsRuntimeHost unit tests
      if: inputs.platform == 'Android'
      shell: bash
      env:
        JS_ENGINE: ${{ inputs.js-engine }}
      run: |
        args=(-PabiFilters=x86_64 "-PjsEngine=$JS_ENGINE" -PndkVersion=27.2.12479018
              assembleDebug assembleDebugAndroidTest)
        project=Dependencies/JsRuntimeHost/Tests/UnitTests/Source/Android
        bash "$project/gradlew" -p "$project" "${args[@]}"
    - name: Configure iOS simulator JsRuntimeHost unit tests
      if: inputs.platform == 'iOS'
      shell: bash
      env:
        JS_ENGINE: ${{ inputs.js-engine }}
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
      run: |
        build=build/mobile-tests-JsRuntimeHost
        cmake -S Dependencies/JsRuntimeHost -B "$build" -G Xcode \
          -DIOS=ON -DPLATFORM=SIMULATORARM64 \
          "-DDEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" \
          "-DNAPI_JAVASCRIPT_ENGINE=$JS_ENGINE" -DJSRUNTIMEHOST_TESTS=ON
    - name: Build iOS simulator JsRuntimeHost unit tests
      if: inputs.platform == 'iOS'
      shell: bash
      run: |
        cmake --build build/mobile-tests-JsRuntimeHost --config RelWithDebInfo --target UnitTests -- \
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO
    - name: Package Android unit-test artifacts
      if: inputs.platform == 'Android'
      shell: bash
      run: |
        project=Dependencies/JsRuntimeHost/Tests/UnitTests/Source/Android
        mkdir -p test-artifacts/JsRuntimeHost
        cp "$project/app/build/outputs/apk/debug/app-debug.apk" test-artifacts/JsRuntimeHost/app.apk
        cp "$project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" test-artifacts/JsRuntimeHost/tests.apk
    - name: Package iOS unit-test artifacts
      if: inputs.platform == 'iOS'
      shell: bash
      run: |
        app=build/mobile-tests-JsRuntimeHost/Tests/UnitTests/RelWithDebInfo-iphonesimulator/UnitTests.app
        mkdir -p test-artifacts/JsRuntimeHost
        tar -czf test-artifacts/JsRuntimeHost/app.tar.gz -C "$(dirname "$app")" "$(basename "$app")"
    - uses: actions/upload-artifact@v6
      with:
        name: UnitTests-${{ inputs.platform }}-JsRuntimeHost-${{ inputs.js-engine }}
        path: test-artifacts/JsRuntimeHost
        if-no-files-found: error
